    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 640

  steps_G:
    section: "Scheduling"
    label: "Number of control steps in G mode"
    description: "Number of control steps used in G mode."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 650

  seed_time_sigma:
    section: "Scheduling"
    label: "Seed addition time in sigma mode"
    description: "Seed addition time used in sigma mode."
    unit: "s"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 660

  seed_time_G:
    section: "Scheduling"
    label: "Seed addition time in G mode"
    description: "Seed addition time used in G mode."
    unit: "s"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 670

  params.R:
    section: "Physical properties"
    label: "Gas constant params.R"
    description: "Universal gas constant."
    unit: "J/(mol*K)"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 680

  k:
    section: "Physical properties"
    label: "Heat transfer coefficient k"
    description: "Heat transfer coefficient between jacket and reactor."
    unit: "J/(K*s*m^2)"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 690

  k_loss:
    section: "Physical properties"
    label: "Heat loss coefficient k_loss"
    description: "Heat loss coefficient between reactor and surroundings."
    unit: "J/(K*s*m^2)"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 700

  c_p:
    section: "Physical properties"
    label: "Specific heat capacity c_p"
    description: "Specific heat capacity of the solvent."
    unit: "J/(kg*K)"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 710

  rho_solvent:
    section: "Physical properties"
    label: "Solvent density rho_solvent"
    description: "Density of the solvent."
    unit: "kg/m^3"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 720

  rho_solute:
    section: "Physical properties"
    label: "Solute density rho_solute"
    description: "Density of the solute."
    unit: "kg/m^3"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 730

  m_solvent:
    section: "Physical properties"
    label: "Solvent mass m_solvent"
    description: "Mass of solvent in the reactor."
    unit: "kg"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 740

  r_reactor:
    section: "Physical properties"
    label: "Reactor radius r_reactor"
    description: "Reactor radius used by heat-transfer geometry terms."
    unit: "m"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 750

  area_1:
    section: "Derived controller parameters"
    label: "Contact area area_1"
    description: "Contact area between jacket and reactor."
    unit: "m^2"
    kind: "derived"
    compute_from: "area_1"
    expression: "2 * m_solvent / (rho_solvent * r_reactor)"
    depends_on: [m_solvent, rho_solvent, r_reactor]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  area_2:
    section: "Derived controller parameters"
    label: "Heat-loss area area_2"
    description: "Reactor top or section area used for heat-loss terms."
    unit: "m^2"
    kind: "derived"
    compute_from: "area_2"
    expression: "pi * r_reactor^2"
    depends_on: [r_reactor]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.tau_1:
    section: "Derived controller parameters"
    label: "Time constant params.tau_1"
    description: "Time constant between jacket and reactor."
    unit: "s"
    kind: "derived"
    compute_from: "tau_1"
    expression: "(c_p * m_solvent) / (k * area_1)"
    depends_on: [c_p, m_solvent, k, area_1]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.tau_2:
    section: "Derived controller parameters"
    label: "Time constant params.tau_2"
    description: "Time constant for heat loss to the environment."
    unit: "s"
    kind: "derived"
    compute_from: "tau_2"
    expression: "(c_p * m_solvent) / (k_loss * area_2)"
    depends_on: [c_p, m_solvent, k_loss, area_2]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.rho_solute:
    section: "Derived controller parameters"
    label: "Mapped density params.rho_solute"
    description: "Solute density mirrored into the controller params namespace."
    unit: "kg/m^3"
    kind: "derived"
    compute_from: "rho_solute_map"
    expression: "params.rho_solute = rho_solute"
    depends_on: [rho_solute]
    derived: true
    publish_to: [controller]
    ui:
      visible: false
