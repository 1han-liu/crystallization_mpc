version: 1
params:
  dt:
    section: "Loop interval"
    label: "Time step"
    description: "Time between controller calculations."
    unit: "s"
    reference:
      origin: "matlab"
      name: "dt"
      label: "Time step t [s]"
      source: "parameters.m:30; gui_main/param_section.m:9"
      definition: "Time between controller calculations."
    kind: "basic"
    derived: false
    publish_to: [controller, gsensor]
    ui:
      visible: true
      order: 10

  resolution:
    section: "Shared estimation"
    label: "Resolution of PVM"
    description: "Physical length represented by one image pixel."
    unit: "m/px"
    reference:
      origin: "matlab"
      name: "resolution"
      label: "Resolution of PVM: resolution [m]"
      source: "parameters_G.m:2; subroutines_gsensor/detection/update_EKF_G.m"
      definition: "PVM pixel-to-length calibration used to convert tracked distances and growth rates to metres and metres per second."
      unit_note: "MATLAB GUI labels this [m]. The conversion multiplies image distances in pixels by resolution; m/px makes that per-pixel meaning explicit."
    kind: "basic"
    derived: false
    publish_to: [controller, gsensor]
    ui:
      visible: true
      order: 20

  q2:
    section: "Shared estimation"
    label: "Process noise for G array"
    description: "Controls how freely the growth estimate can change."
    unit: "-"
    reference:
      origin: "matlab"
      name: "q2"
      label: "Process noise for G array from DSCGR: q2 [-]"
      source: "parameters_G.m:3; subroutines_gsensor/detection/create_EKF_G.m:4"
      definition: "Process-noise scale for the three-state DSCGR filter; larger values increase process uncertainty relative to measurement noise."
      formula: "Q_func = @(q2, dt) [dt^4/4, dt^3/2, dt^2/2; dt^3/2, dt^2, dt; dt^2/2, dt, 1] * q2 * resolution^2;"
      unit_note: "[-] follows the MATLAB GUI convention for this filter scale; it is not a covariance matrix unit."
    kind: "basic"
    derived: false
    publish_to: [controller, gsensor]
    ui:
      visible: true
      order: 30

  r_diag:
    section: "Shared estimation"
    label: "Measurement noise for G array"
    description: "Three diagonal weights for the growth estimator."
    unit: "-"
    reference:
      origin: "matlab"
      name: "r_diag"
      label: "Diagonal array of measurement noise for G array from DSCGR: r_diag [-]"
      source: "parameters_G.m:4; subroutines_gsensor/detection/create_EKF_G.m:5"
      definition: "Three entries form the measurement-noise diagonal of the DSCGR filter, in the original state order. Larger entries reduce trust in the corresponding measurements."
      formula: "R = diag(r_diag) * resolution^2;"
      unit_note: "[-] preserves the MATLAB GUI convention for these diagonal weights."
    kind: "basic"
    derived: false
    publish_to: [controller, gsensor]
    ui:
      visible: true
      order: 40

  dt_G:
    section: "Growth rate estimation"
    label: "Time step for DSCGR"
    description: "Time between images used to estimate growth."
    unit: "s"
    reference:
      origin: "matlab"
      name: "dt_G"
      label: "Time step: dt_G [s]"
      source: "parameters_G.m:1; subroutines_gsensor/detection/create_EKF_G.m"
      definition: "Sampling interval passed to the growth-rate filter and distance-to-rate calculations."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 110

  ptr_format:
    section: "Growth rate estimation"
    label: "Figure format"
    description: "Legacy figure format; currently unused."
    unit: "-"
    reference:
      origin: "matlab"
      name: "ptr_format"
      label: "Figure format: ptr_format [-]"
      source: "parameters_G.m:5"
      definition: "Original MATLAB figure-format string, initialized as %d."
      formula: "ptr_format = '%d';"
      note: "The current Python configuration retains a list of format strings; the growth-processing and controller paths do not consume this setting."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 120

  alignment_method:
    section: "Image alignment"
    label: "Alignment method"
    description: "Aligns segmented frames before detecting growth lines."
    unit: "-"
    reference:
      origin: "python"
      name: "alignment_method"
      source: "src/crystallization_mpc/apps/gsensor/growth_rate_processor.py"
      definition: "Selects the Python frame-registration method: none, centroid, fft, kalman, loftr, sift, optical_flow, or ecc. none skips registration."
      note: "Python addition; no corresponding MATLAB parameter."
    kind: "basic"
    derived: false
    choices: [none, centroid, fft, kalman, loftr, sift, optical_flow, ecc]
    publish_to: [gsensor]
    ui:
      visible: true
      control: "select"
      order: 105

  params_G.width:
    section: "Growth line detection"
    label: "Width for detection"
    description: "Search half-width on each side of the tracked line."
    unit: "px"
    reference:
      origin: "matlab"
      name: "params_G.width"
      label: "Width for detection: params_G.width [-]"
      source: "parameters_G.m:9; subroutines_gsensor/detection/calc_masked_image.m:2-3"
      definition: "Sets the perpendicular half-width of the detection strip. A value of 100 searches 100 pixels on each side."
      formula: |-
        up = t + n * width;
        dp = t - n * width;
      unit_note: "MATLAB GUI shows [-]; pixel units follow the image-coordinate mask calculation."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 130

  params_G.ratio:
    section: "Growth line detection"
    label: "Length extension ratio"
    description: "Along-line extension ratio; currently unused."
    unit: "-"
    reference:
      origin: "matlab"
      name: "params_G.ratio"
      label: "Length extension ratio for detection: params_G.ratio [-]"
      source: "parameters_G.m:10; subroutines_gsensor/detection/calc_masked_image.m:5-15"
      definition: "Original ratio for extending the mask past each endpoint of the tracked line."
      formula: |-
        rp = e + (e - t) * ratio;
        lp = t - (e - t) * ratio;
      note: "The length mask (mask2) is commented out in both MATLAB and Python. The active mask uses only the perpendicular width, so changing ratio has no effect."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 140

  params_G.delta_theta:
    section: "Growth line detection"
    label: "Hough angle deviation"
    description: "Maximum angle deviation from the previous line."
    unit: "deg"
    reference:
      origin: "matlab"
      name: "params_G.delta_theta"
      label: "Angle of Hough transformation deviation: params_G.delta_theta [-]"
      source: "parameters_G.m:11; subroutines_gsensor/detection/calc_theta_range.m:2"
      definition: "MATLAB searches from theta - delta_theta to theta + delta_theta using 20 angle samples."
      formula: "theta_range = linspace(theta-delta_theta, theta+delta_theta, 20);"
      note: "Python uses this as the acceptance limit for detected-line angle changes. Its Hough angular resolution is a separate parameter."
      unit_note: "MATLAB GUI shows [-]; degrees follow the angle range and degree-based Hough coordinates."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 150

  params_G.width_divider:
    section: "Growth line detection"
    label: "Hough width-range divider"
    description: "Narrows the preferred line-position search range."
    unit: "-"
    reference:
      origin: "matlab"
      name: "params_G.width_divider"
      label: "Width range of Hough transformation divider: params_G.width_divider [-]"
      source: "parameters_G.m:12; subroutines_gsensor/detection/update_line.m:17"
      definition: "Divides the detection half-width to set the preferred rho range around the previous line. Increasing it narrows that range."
      formula: "Hs(rhos < line.rho - params_G.width / params_G.width_divider | rhos > line.rho + params_G.width / params_G.width_divider) = 0;"
      note: "Python first prefers this narrow band, then allows recovery candidates within the full detection half-width."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 160

  params_G.num_peak:
    section: "Growth line detection"
    label: "Number of Hough peaks"
    description: "Limits the number of retained line candidates."
    unit: "-"
    reference:
      origin: "matlab"
      name: "params_G.num_peak"
      label: "Number of peaks of Hough transformation: params_G.num_peak [-]"
      source: "parameters_G.m:13; subroutines_gsensor/detection/update_line.m:18"
      definition: "Maximum number of peaks requested from MATLAB houghpeaks."
      formula: "peaks = houghpeaks(Hs, params_G.num_peak, 'NHoodSize', [9, 1]);"
      note: "Python uses num_peak as the candidate-count limit unless hough_max_candidates is explicitly supplied. OpenCV candidates are not MATLAB accumulator peaks."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 170

  params_G.len_min:
    section: "Growth line detection"
    label: "Minimal Hough line length"
    description: "Rejects detected lines shorter than this length."
    unit: "px"
    reference:
      origin: "matlab"
      name: "params_G.len_min"
      label: "Minimal length of Hough transformation: params_G.len_min [-]"
      source: "parameters_G.m:14; subroutines_gsensor/detection/update_line.m:28"
      definition: "Final line-length acceptance threshold, applied after the Hough transform."
      formula: "if norm(lines(ii).point1 - lines(ii).point2) < params_G.len_min"
      unit_note: "MATLAB GUI shows [-]; pixel units follow the endpoint coordinates."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 180

  params_G.hough_threshold:
    section: "Growth line detection"
    label: "OpenCV vote threshold"
    description: "Minimum Hough votes needed to propose a line."
    unit: "votes"
    reference:
      origin: "python"
      name: "params_G.hough_threshold"
      source: "src/crystallization_mpc/apps/gsensor/detection/update_line.py:houghlines_opencv"
      definition: "The threshold argument of cv2.HoughLinesP. Increasing it requires stronger line evidence."
      formula: "threshold=threshold"
      note: "Python addition; MATLAB does not expose an equivalent configurable vote threshold here."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 181

  params_G.hough_min_line_length:
    section: "Growth line detection"
    label: "OpenCV minimum line length"
    description: "Shortest segment proposed by the Hough detector."
    unit: "px"
    reference:
      origin: "python"
      name: "params_G.hough_min_line_length"
      source: "src/crystallization_mpc/apps/gsensor/detection/update_line.py:houghlines_opencv"
      definition: "The minLineLength argument of cv2.HoughLinesP. The separate params_G.len_min test is applied afterwards."
      formula: "minLineLength=min_line_length"
      note: "Python exposes this setting; MATLAB fixes houghlines 'Minlength' at 7 pixels."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 182

  params_G.hough_max_line_gap:
    section: "Growth line detection"
    label: "OpenCV maximum line gap"
    description: "Largest gap allowed when joining line segments."
    unit: "px"
    reference:
      origin: "python"
      name: "params_G.hough_max_line_gap"
      source: "src/crystallization_mpc/apps/gsensor/detection/update_line.py:houghlines_opencv"
      definition: "The maxLineGap argument of cv2.HoughLinesP."
      formula: "maxLineGap=max_line_gap"
      note: "Python exposes this setting; MATLAB fixes houghlines 'FillGap' at 5 pixels."
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 183

  sigma_set:
    section: "Target"
    label: "Target of relative supersaturation"
    description: "Desired relative supersaturation in sigma mode."
    unit: "-"
    reference:
      origin: "matlab"
      name: "sigma_set"
      label: "Target of relative supersaturation: sigma_set [-]"
      source: "parameters.m:6; subroutines_controller/control/calc_relative_sigma.m:3"
      definition: "Target for (c - c_sat) / c_sat. Enter a fraction: 0.035 means 3.5%."
      formula: "relative_sigma = (c - c_sat) / c_sat;"
      unit_note: "[-] agrees with the original MATLAB GUI and relative-supersaturation equation. The [g/g] comment in parameters_on_target_change.m is inconsistent with that ratio."
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 210

  G_set:
    section: "Target"
    label: "Target of growth rate"
    description: "Desired crystal growth rate in G mode."
    unit: "m/s"
    reference:
      origin: "matlab"
      name: "G_set"
      label: "Target of growth rate: G_set [m/s]"
      source: "parameters.m:7; subroutines_controller/control/calc_e_target.m"
      definition: "Growth-rate target used when target is G; the objective converts it to an equivalent supersaturation for comparison."
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 220

  target_set:
    section: "Target"
    label: "Target value"
    description: "Target selected by the active sigma or G mode."
    unit: "-"
    reference:
      origin: "matlab"
      name: "target_set"
      label: "Target value: target_set [-]"
      source: "parameters_on_target_change.m:1-5"
      definition: "Uses sigma_set in sigma mode and G_set in G mode."
      formula: |-
        if strcmp(target, 'sigma')
            target_set = sigma_set;
        elseif strcmp(target, 'G')
            target_set = G_set;
        end
      unit_note: "The original GUI uses [-]; the effective unit is [-] for sigma or m/s for G."
    kind: "derived"
    compute_from: "target_selection"
    expression: 'if target=="sigma", target_set=sigma_set; elseif target=="G", target_set=G_set; end'
    depends_on: [target, sigma_set, G_set]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.var_dT_dt:
    section: "Kalman filter for MPC"
    label: "Temperature process-noise variance"
    description: "Allows uncertainty in the temperature gradient."
    unit: "(K/s)^2"
    reference:
      origin: "matlab"
      name: "params.var_dT_dt"
      label: "Temperature variance of process noise: params.var_dT_dt [(K/s)^2]"
      source: "parameters.m:55; subroutines_controller/control/calc_Q.m:15"
      definition: "Scales the corresponding part of the process-noise covariance Q. Increasing it gives the model less confidence in that gradient."
      formula: "Q = Q_M_T * var_dT_dt + Q_M_c * var_dc_dt;"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 230

  params.var_dc_dt:
    section: "Kalman filter for MPC"
    label: "Concentration process-noise variance"
    description: "Allows uncertainty in the concentration gradient."
    unit: "((g/g)/s)^2"
    reference:
      origin: "matlab"
      name: "params.var_dc_dt"
      label: "Concentration variance of process noise: params.var_dc_dt [((g/g)/s)^2]"
      source: "parameters.m:56; subroutines_controller/control/calc_Q.m:15"
      definition: "Scales the corresponding part of the process-noise covariance Q. Increasing it gives the model less confidence in that gradient."
      formula: "Q = Q_M_T * var_dT_dt + Q_M_c * var_dc_dt;"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 240

  params.dT:
    section: "Kalman filter for MPC"
    label: "Temperature measurement inaccuracy"
    description: "Expected uncertainty of the temperature measurement."
    unit: "K"
    reference:
      origin: "matlab"
      name: "params.dT"
      source: "parameters.m:57; subroutines_controller/control/calc_R.m:9-13"
      definition: "Measurement inaccuracy used as a standard-deviation scale; the filter squares it to build the measurement-noise covariance. MATLAB recommends setting it above the real measurement deviation."
      formula: |-
        R = [
          dT^2,             0;
          0,                dc^2;
        ];
      note: "Uses the parameters.m variable. The old MATLAB GUI references var_dT / var_dc instead, which do not match these definitions."
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 250

  params.dc:
    section: "Kalman filter for MPC"
    label: "Concentration measurement inaccuracy"
    description: "Expected uncertainty of the concentration measurement."
    unit: "g/g"
    reference:
      origin: "matlab"
      name: "params.dc"
      source: "parameters.m:58; subroutines_controller/control/calc_R.m:9-13"
      definition: "Measurement inaccuracy used as a standard-deviation scale; the filter squares it to build the measurement-noise covariance. MATLAB recommends setting it above the real measurement deviation."
      formula: |-
        R = [
          dT^2,             0;
          0,                dc^2;
        ];
      note: "Uses the parameters.m variable. The old MATLAB GUI references var_dT / var_dc instead, which do not match these definitions."
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 260

  params.n:
    section: "Growth rate model"
    label: "Reaction order"
    description: "Sets how strongly supersaturation affects control growth."
    unit: "-"
    reference:
      origin: "matlab"
      name: "params.n"
      label: "Reaction order: params.n [-]"
      source: "parameters.m:62; subroutines_controller/control/calc_G.m:5-11"
      definition: "Exponent of the absolute relative supersaturation in the control growth-rate model."
      formula: "G = k_0 * abs(relative_sigma) ^ n * exp(-E_A / (R * T)) * sign(relative_sigma);"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 270

  params.E_A:
    section: "Growth rate model"
    label: "Activation energy"
    description: "Sets temperature sensitivity of control growth."
    unit: "J/mol"
    reference:
      origin: "matlab"
      name: "params.E_A"
      label: "Activation energy: params.E_A [J/mol]"
      source: "parameters.m:63; subroutines_controller/control/calc_G.m:5-11"
      definition: "Activation energy in the Arrhenius factor of the control growth-rate model."
      formula: "G = k_0 * abs(relative_sigma) ^ n * exp(-E_A / (R * T)) * sign(relative_sigma);"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 280

  params.k_0:
    section: "Growth rate model"
    label: "Reaction coefficient prefactor"
    description: "Scales the control growth-rate model."
    unit: "m/s"
    reference:
      origin: "matlab"
      name: "params.k_0"
      label: "Reaction coefficient prefactor: params.k_0 [-]"
      source: "parameters.m:64; subroutines_controller/control/calc_G.m:5-11"
      definition: "Prefactor multiplying supersaturation and the Arrhenius temperature term."
      formula: |-
        params.k_0 = 0.1 * 3.0e-8 / 0.035^1.5 / exp(-120e3 / params.R / 306.15);
        G = k_0 * abs(relative_sigma) ^ n * exp(-E_A / (R * T)) * sign(relative_sigma);
      unit_note: "Uses [m/s] from parameters.m; the original GUI marks this [-]."
    kind: "derived"
    compute_from: "k_0"
    expression: "0.1 * 3.0e-8 / 0.035^1.5 / exp(-120e3 / params.R / 306.15)"
    depends_on: [params.R]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.n_proc:
    section: "Growth rate process model"
    label: "Reaction order (process)"
    description: "Sets how strongly supersaturation affects simulation process growth."
    unit: "-"
    reference:
      origin: "matlab"
      name: "params.n_proc"
      label: "Reaction order: params.n_proc [-]"
      source: "parameters.m:66; subroutines_controller/control/calc_G.m:5-11"
      definition: "Exponent of the absolute relative supersaturation in the simulation process growth-rate model."
      formula: |-
        [n, E_A, R, k_0] = assign_list([params.n_proc, params.E_A_proc, params.R, params.k_0_proc]);
        G = k_0 * abs(relative_sigma) ^ n * exp(-E_A / (R * T)) * sign(relative_sigma);
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 290

  params.E_A_proc:
    section: "Growth rate process model"
    label: "Activation energy (process)"
    description: "Sets temperature sensitivity of simulation process growth."
    unit: "J/mol"
    reference:
      origin: "matlab"
      name: "params.E_A_proc"
      label: "Activation energy: params.E_A_proc [J/mol]"
      source: "parameters.m:67; subroutines_controller/control/calc_G.m:5-11"
      definition: "Activation energy in the Arrhenius factor of the simulation process growth-rate model."
      formula: |-
        [n, E_A, R, k_0] = assign_list([params.n_proc, params.E_A_proc, params.R, params.k_0_proc]);
        G = k_0 * abs(relative_sigma) ^ n * exp(-E_A / (R * T)) * sign(relative_sigma);
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 300

  params.k_0_proc:
    section: "Growth rate process model"
    label: "Reaction coefficient prefactor (process)"
    description: "Scales the simulation process growth-rate model."
    unit: "m/s"
    reference:
      origin: "matlab"
      name: "params.k_0_proc"
      label: "Reaction coefficient prefactor: params.k_0_proc [-]"
      source: "parameters.m:68; subroutines_controller/control/calc_G.m:5-11"
      definition: "Prefactor multiplying supersaturation and the Arrhenius temperature term."
      formula: |-
        params.k_0_proc = 3.0e-8 / 0.035^1.5 / exp(-120e3 / params.R / 306.15);
        [n, E_A, R, k_0] = assign_list([params.n_proc, params.E_A_proc, params.R, params.k_0_proc]);
        G = k_0 * abs(relative_sigma) ^ n * exp(-E_A / (R * T)) * sign(relative_sigma);
      unit_note: "Uses [m/s] from parameters.m; the original GUI marks this [-]."
    kind: "derived"
    compute_from: "k_0_proc"
    expression: "3.0e-8 / 0.035^1.5 / exp(-120e3 / params.R / 306.15)"
    depends_on: [params.R]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.w_sigma:
    section: "Objective weights"
    label: "Weight for relative supersaturation"
    description: "Balances sigma tracking against temperature-gradient changes."
    unit: "-"
    reference:
      origin: "matlab"
      name: "params.w_sigma"
      label: "Weight for relative supersaturation: params.w_sigma [-]"
      source: "parameters.m:47; subroutines_controller/control/objective_function.m:13-21"
      definition: "Weight w for squared relative-supersaturation tracking error in sigma mode."
      formula: |-
        f1 = e_target ^ 2;
        f2 = (dT_dt_set - dT_dt) ^ 2;
        f = w * f1 + w_dT_dt * f2;
      unit_note: "[-] follows the original MATLAB GUI convention for objective weights."
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 310

  params.w_G:
    section: "Objective weights"
    label: "Weight for converted growth rate"
    description: "Balances G tracking against temperature-gradient changes."
    unit: "-"
    reference:
      origin: "matlab"
      name: "params.w_G"
      label: "Weight for converted growth rate: params.w_G [-]"
      source: "parameters.m:48; subroutines_controller/control/objective_function.m:13-21"
      definition: "Weight w for squared growth-rate error after conversion to equivalent relative supersaturation; it does not weight raw (m/s) errors."
      formula: |-
        f1 = e_target ^ 2;
        f2 = (dT_dt_set - dT_dt) ^ 2;
        f = w * f1 + w_dT_dt * f2;
      unit_note: "[-] follows the original MATLAB GUI convention for objective weights."
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 320

  params.w_dT_dt:
    section: "Objective weights"
    label: "Weight for temperature gradient"
    description: "Penalizes changing the requested temperature gradient."
    unit: "-"
    reference:
      origin: "matlab"
      name: "params.w_dT_dt"
      label: "Weight for temperature gradient: params.w_dT_dt [-]"
      source: "parameters.m:49; subroutines_controller/control/objective_function.m:13-21"
      definition: "Weight on the squared difference between the requested and current temperature gradients; increasing it discourages abrupt gradient changes."
      formula: |-
        f1 = e_target ^ 2;
        f2 = (dT_dt_set - dT_dt) ^ 2;
        f = w * f1 + w_dT_dt * f2;
      unit_note: "[-] follows the original MATLAB GUI convention for objective weights."
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 330

