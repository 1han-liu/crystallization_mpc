version: 1
params:
  dt:
    section: "Loop interval"
    label: "Time step t"
    description: "Global control loop interval."
    unit: "s"
    kind: "basic"
    derived: false
    publish_to: [controller, gsensor]
    ui:
      visible: true
      order: 10

  resolution:
    section: "Shared estimation"
    label: "Camera resolution"
    description: "Pixel-to-length conversion used by growth-rate estimation."
    unit: "m"
    kind: "basic"
    derived: false
    publish_to: [controller, gsensor]
    ui:
      visible: true
      order: 20

  q2:
    section: "Shared estimation"
    label: "Process noise q2"
    description: "Shared EKF process noise term."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller, gsensor]
    ui:
      visible: true
      order: 30

  r_diag:
    section: "Shared estimation"
    label: "Measurement noise diagonal r_diag"
    description: "Shared EKF measurement noise diagonal."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller, gsensor]
    ui:
      visible: true
      order: 40

  dt_G:
    section: "Growth rate estimation"
    label: "Growth-rate time step dt_G"
    description: "Sampling interval used by gsensor growth-rate estimation."
    unit: "s"
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 110

  ptr_format:
    section: "Growth rate estimation"
    label: "Pointer display format"
    description: "Display format options used in gsensor parameter views."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 120

  params_G.width:
    section: "Growth line detection"
    label: "Search window width"
    description: "Search window width for growth-line detection."
    unit: "px"
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 130

  params_G.ratio:
    section: "Growth line detection"
    label: "Shape ratio threshold"
    description: "Shape ratio threshold used in line updates."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 140

  params_G.delta_theta:
    section: "Growth line detection"
    label: "Angular step"
    description: "Angular step used by line search."
    unit: "deg"
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 150

  params_G.width_divider:
    section: "Growth line detection"
    label: "Width divider"
    description: "Divider applied to narrow the detection width."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 160

  params_G.num_peak:
    section: "Growth line detection"
    label: "Peak count limit"
    description: "Maximum number of peaks kept during detection."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 170

  params_G.len_min:
    section: "Growth line detection"
    label: "Minimum line length"
    description: "Minimum accepted growth-line length."
    unit: "px"
    kind: "basic"
    derived: false
    publish_to: [gsensor]
    ui:
      visible: true
      order: 180

  sigma_set:
    section: "Target"
    label: "Target of relative supersaturation: sigma_set"
    description: "Supersaturation target used when target mode is sigma."
    unit: "g/g"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 210

  G_set:
    section: "Target"
    label: "Target of growth rate: G_set"
    description: "Growth-rate target used when target mode is G."
    unit: "m/s"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 220

  target_set:
    section: "Target"
    label: "Target value: target_set"
    description: "Effective target after sigma/G selection."
    unit: "-"
    kind: "derived"
    compute_from: "target_selection"
    expression: 'if target=="sigma", target_set=sigma_set; elseif target=="G", target_set=G_set; end'
    depends_on: [target, sigma_set, G_set]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.var_dT_dt:
    section: "Kalman filter for MPC"
    label: "Temperature variance of process noise: params.var_dT_dt"
    description: "Process variance for the temperature-gradient state."
    unit: "(K/s)^2"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 230

  params.var_dc_dt:
    section: "Kalman filter for MPC"
    label: "Concentration variance of process noise: params.var_dc_dt"
    description: "Process variance for the concentration-gradient state."
    unit: "((g/g)/s)^2"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 240

  params.dT:
    section: "Kalman filter for MPC"
    label: "Temperature measurement inaccuracy: params.dT"
    description: "Temperature measurement uncertainty."
    unit: "K"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 250

  params.dc:
    section: "Kalman filter for MPC"
    label: "Concentration measurement inaccuracy: params.dc"
    description: "Concentration measurement uncertainty."
    unit: "g/g"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 260

  params.n:
    section: "Growth rate model"
    label: "Reaction order: params.n"
    description: "Growth-rate order with respect to supersaturation."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 270

  params.E_A:
    section: "Growth rate model"
    label: "Activation energy: params.E_A"
    description: "Activation energy for the main growth-rate model."
    unit: "J/mol"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 280

  params.k_0:
    section: "Growth rate model"
    label: "Reaction coefficient prefactor: params.k_0"
    description: "Growth-rate coefficient used by the main controller model."
    unit: "m/s"
    kind: "derived"
    compute_from: "k_0"
    expression: "0.1 * 3.0e-8 / 0.035^1.5 / exp(-120e3 / params.R / 306.15)"
    depends_on: [params.R]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.n_proc:
    section: "Growth rate process model"
    label: "Process-model order: params.n_proc"
    description: "Process-model order for growth-rate adaptation."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 290

  params.E_A_proc:
    section: "Growth rate process model"
    label: "Process-model activation energy: params.E_A_proc"
    description: "Process-model activation energy for adaptation."
    unit: "J/mol"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 300

  params.k_0_proc:
    section: "Growth rate process model"
    label: "Process-model prefactor: params.k_0_proc"
    description: "Growth-rate coefficient used by the process adaptation model."
    unit: "m/s"
    kind: "derived"
    compute_from: "k_0_proc"
    expression: "3.0e-8 / 0.035^1.5 / exp(-120e3 / params.R / 306.15)"
    depends_on: [params.R]
    derived: true
    publish_to: [controller]
    ui:
      visible: false

  params.w_sigma:
    section: "Objective weights"
    label: "Objective weight: params.w_sigma"
    description: "Objective weight for supersaturation tracking."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 310

  params.w_G:
    section: "Objective weights"
    label: "Objective weight: params.w_G"
    description: "Objective weight for growth-rate tracking."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 320

  params.w_dT_dt:
    section: "Objective weights"
    label: "Objective weight: params.w_dT_dt"
    description: "Objective weight for temperature-gradient effort."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 330

  sigma_threshold:
    section: "Target switching"
    label: "Supersaturation threshold"
    description: "Threshold below which sigma-specific logic switches regime."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 340

  params.PI_mode:
    section: "PI tuning"
    label: "PI tuning mode: params.PI_mode"
    description: "PI tuning rule used to derive target-loop gains."
    unit: "-"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 350

  params.K_u:
    section: "PI tuning"
    label: "Ultimate gain: params.K_u"
    description: "Ultimate gain used for PI tuning."
    unit: "K/s"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 360

  params.T_u:
    section: "PI tuning"
    label: "Oscillation period: params.T_u"
    description: "Oscillation period used for PI tuning."
    unit: "s"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 370

  params.K_P_target:
    section: "Target loop"
    label: "Target loop proportional gain: params.K_P_target"
    description: "Effective proportional gain for the target loop."
    unit: "-"
    kind: "derived"
    compute_from: "k_p_target"
    expression: 'if params.PI_mode=="Ziegler_Nichols", params.K_P_target = 0.45 * params.K_u; end'
    depends_on: [params.PI_mode, params.K_u]
    derived: true
    publish_to: [controller]
    ui:
      visible: false
      order: 380

  params.K_I_target:
    section: "Target loop"
    label: "Target loop integral gain: params.K_I_target"
    description: "Effective integral gain for the target loop."
    unit: "-"
    kind: "derived"
    compute_from: "k_i_target"
    expression: 'if params.PI_mode=="Ziegler_Nichols", params.K_I_target = 0; end'
    depends_on: [params.PI_mode, params.K_u, params.T_u]
    derived: true
    publish_to: [controller]
    ui:
      visible: false
      order: 390

  params.K_P_dT_dt:
    section: "dT/dt loop"
    label: "dT/dt proportional gain: params.K_P_dT_dt"
    description: "Proportional gain for the dT/dt loop."
    unit: "s"
