    label: "Temperature proportional gain in sigma mode: params.K_P_T_sigma"
    description: "Temperature-loop proportional gain used in sigma mode."
    unit: "s^2"
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 420

  params.K_I_T_sigma:
