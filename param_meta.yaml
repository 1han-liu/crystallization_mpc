      origin: "matlab"
      name: "t_lag_perc"
      label: "Additional time lag percentage: t_lag_perc [-]"
      source: "parameters.m:109; subroutines_controller/control/calc_t_lag_perc.m:2; gui_main/snipptets_controller/calculate_lag_time.m:2"
      definition: "Enter a fraction, not a percent number. 20/150 is about 0.1333 (13.33%); with t_lag = 150 s, the maximum added lag is 20 s for a positive target."
      formula: |-
        t_lag_perc_val = 1 + t_lag_perc * atan(t_lag_threshold_perc * target_set / abs_e_target) / (pi / 2);
        t_lag_list(ii) = t_lag * t_lag_perc_list(ii);
    kind: "basic"
    derived: false
    publish_to: [controller]
    ui:
      visible: true
      order: 470
