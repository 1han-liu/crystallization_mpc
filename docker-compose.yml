services:
  central:
    build:
      context: .
      dockerfile: services/mpc/Dockerfile
    command: ["uvicorn", "crystallization_mpc.apps.central.ui.app:web_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - RABBIT_EXCHANGE=idp.bus
      - RABBIT_HEARTBEAT_SEC=0
      - PARAMS_FILE=/app/params_default.yaml
      - PARAM_META_FILE=/app/param_meta.yaml
      - EXPERIMENT_ROOT=/data/experiments
      - EXPERIMENT_HOST_ROOT_DISPLAY=${EXPERIMENT_HOST_ROOT:-./.runtime/experiments}
    volumes:
      - type: bind
        source: ${EXPERIMENT_HOST_ROOT:-./.runtime/experiments}
        target: /data/experiments
        bind:
          create_host_path: true
    depends_on:
      - rabbitmq
    restart: unless-stopped

  gsensor:
    build:
      context: .
      dockerfile: services/mpc/Dockerfile
    command: ["uvicorn", "crystallization_mpc.apps.gsensor.app:web_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - RABBIT_EXCHANGE=idp.bus
      - EXPERIMENT_ROOT=/data/experiments
      - GSENSOR_IMAGE_POLL_INTERVAL_S=${GSENSOR_IMAGE_POLL_INTERVAL_S:-1.0}
    volumes:
      - type: bind
        source: ${EXPERIMENT_HOST_ROOT:-./.runtime/experiments}
        target: /data/experiments
        bind:
          create_host_path: true
    depends_on:
      - rabbitmq
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  influxdb:
    image: influxdb:2.7
    ports:
      - "8087:8086"
    env_file:
      - config/influxdb.env
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping", "-host", "http://localhost:8086"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
