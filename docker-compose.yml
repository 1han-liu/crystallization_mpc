x-mpc-image: &mpc-image crystallization-mpc-app:local

# Shared device configuration is supplied only to the two device-facing services.
x-opcua-environment: &opcua-environment
  OPCUA_ENDPOINT: ${OPCUA_ENDPOINT:-opc.tcp://host.docker.internal:62552}
  OPCUA_NAMESPACE_INDEX: ${OPCUA_NAMESPACE_INDEX:-2}
  OPCUA_T_NODE: ${OPCUA_T_NODE:-Local.iControl.Experiment1.Trends.Tr.Value}
  OPCUA_T_J_NODE: ${OPCUA_T_J_NODE:-Local.iControl.Experiment1.Trends.Tj.Value}
  OPCUA_C_NODE: ${OPCUA_C_NODE:-Local.iControl.Experiment1.Trends.load.Value}
  OPCUA_COUNT_MIDDLE_NODE: ${OPCUA_COUNT_MIDDLE_NODE:-Local.iControl.Experiment1.Trends.count.Value}
  OPCUA_T_J_SET_NODE: ${OPCUA_T_J_SET_NODE:-iCache.Temperature1}
  OPCUA_AUTH_METHOD: ${OPCUA_AUTH_METHOD:-Anonymous}
  OPCUA_USERNAME: ${OPCUA_USERNAME:-}
  OPCUA_PASSWORD: ${OPCUA_PASSWORD:-}
  OPCUA_SECURITY_POLICY: ${OPCUA_SECURITY_POLICY:-None}
  OPCUA_SECURITY_MODE: ${OPCUA_SECURITY_MODE:-None}
  OPCUA_CERTIFICATE: ${OPCUA_CERTIFICATE:-}
  OPCUA_PRIVATE_KEY: ${OPCUA_PRIVATE_KEY:-}
  OPCUA_SERVER_CERTIFICATE: ${OPCUA_SERVER_CERTIFICATE:-}
  OPCUA_TIMEOUT_S: ${OPCUA_TIMEOUT_S:-5.0}
  OPCUA_JACKET_MIN_K: ${OPCUA_JACKET_MIN_K:-253.15}
  OPCUA_JACKET_MAX_K: ${OPCUA_JACKET_MAX_K:-453.15}
  OPCUA_VERIFY_WRITE: ${OPCUA_VERIFY_WRITE:-true}
  OPCUA_VERIFY_TOLERANCE_K: ${OPCUA_VERIFY_TOLERANCE_K:-0.05}

services:
  central:
    image: *mpc-image
    build:
      context: .
      dockerfile: services/mpc/Dockerfile
    command: ["uvicorn", "crystallization_mpc.apps.central.ui.app:web_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - config/influxdb.env
    environment:
      - UI_MODE=${UI_MODE:-production}
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - RABBIT_EXCHANGE=idp.bus
      - RABBIT_QUEUE=central.in
      - RABBIT_HEARTBEAT_SEC=0
      - CONTROLLER_STATUS_URL=http://controller:8002/api/status
      - GSENSOR_STATUS_URL=http://gsensor:8001/api/status
      - CENTRAL_RUNTIME_INFLUX_ENABLED=${CENTRAL_RUNTIME_INFLUX_ENABLED:-${CONTROLLER_INFLUX_ENABLED:-true}}
      - CONTROLLER_INFLUX_URL=${CONTROLLER_INFLUX_URL:-http://influxdb:8086}
      - PARAMS_DEFAULT_FILE=/app/params_default.yaml
      - PARAMS_FILE=/data/experiments/_system/params_runtime.yaml
      - PARAM_META_FILE=/app/param_meta.yaml
      - EXPERIMENT_ROOT=/data/experiments
      - EXPERIMENT_HOST_ROOT_DISPLAY=${EXPERIMENT_HOST_ROOT:-./.runtime/experiments}
      - EXPERIMENT_EXPORT_ENABLED=${EXPERIMENT_EXPORT_ENABLED:-true}
      - PROCESS_DEVICE_ID=${PROCESS_DEVICE_ID:-crystallizer}
      - CONTROLLER_PROCESS_ENABLED=${CONTROLLER_PROCESS_ENABLED:-false}
      - TELEGRAF_INTERVAL=${TELEGRAF_INTERVAL:-1s}
      - OPCUA_WRITER_AUDIT_DB=/data/opcua_writer/commands.sqlite3
      - GRAFANA_EXPERIMENT_URL=${GRAFANA_EXPERIMENT_URL:-http://localhost:3000/d/crystallization-mpc-analysis/crystallization-mpc-analysis}
    volumes:
      - opcua_writer_data:/data/opcua_writer:ro
      - type: bind
        source: ${EXPERIMENT_HOST_ROOT:-./.runtime/experiments}
        target: /data/experiments
        bind:
          create_host_path: true
    depends_on:
      - rabbitmq
      - controller
      - influxdb
    restart: unless-stopped

  gsensor:
    image: crystallization-mpc-gsensor:local
    build:
      context: .
      dockerfile: services/gsensor/Dockerfile
    command: ["uvicorn", "crystallization_mpc.apps.gsensor.app:web_app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    env_file:
      - config/influxdb.env
    environment:
      - UI_MODE=${UI_MODE:-production}
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - RABBIT_EXCHANGE=idp.bus
      - PARAMS_DEFAULT_FILE=/app/params_default.yaml
      - PARAMS_FILE=/data/experiments/_system/params_runtime.yaml
      - PARAM_META_FILE=/app/param_meta.yaml
      - EXPERIMENT_ROOT=/data/experiments
      - GSENSOR_IMAGE_POLL_INTERVAL_S=${GSENSOR_IMAGE_POLL_INTERVAL_S:-1.0}
      - GSENSOR_HOUGH_DEBUG_ENABLED=${GSENSOR_HOUGH_DEBUG_ENABLED:-false}
      - GSENSOR_STATUS_PUBLISH_ENABLED=true
      - GSENSOR_SAMPLE_PUBLISH_ENABLED=true
      - GSENSOR_INFLUX_ENABLED=true
      - INFLUX_URL=http://influxdb:8086
    volumes:
      - type: bind
        source: ${EXPERIMENT_HOST_ROOT:-./.runtime/experiments}
        target: /data/experiments
        bind:
          create_host_path: true
    depends_on:
      - rabbitmq
      - influxdb
    restart: unless-stopped

  controller:
    image: *mpc-image
    command: ["uvicorn", "crystallization_mpc.apps.controller.app:web_app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    env_file:
      - config/influxdb.env
    environment:
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - RABBIT_EXCHANGE=idp.bus
      - RABBIT_QUEUE=controller.in
      - EXPERIMENT_ROOT=/data/experiments
      - CONTROLLER_ADAPTER=${CONTROLLER_ADAPTER:-}
      - CONTROLLER_PROCESS_ENABLED=${CONTROLLER_PROCESS_ENABLED:-false}
      - CONTROLLER_PROCESS_WRITE_ENABLED=${CONTROLLER_PROCESS_WRITE_ENABLED:-false}
      - PROCESS_DEVICE_ID=${PROCESS_DEVICE_ID:-crystallizer}
      - PROCESS_SAMPLE_MAX_AGE_S=${PROCESS_SAMPLE_MAX_AGE_S:-5.0}
      - PROCESS_STARTUP_TIMEOUT_S=${PROCESS_STARTUP_TIMEOUT_S:-10.0}
      - PROCESS_COMMAND_TTL_S=${PROCESS_COMMAND_TTL_S:-5.0}
      - PROCESS_WRITE_TIMEOUT_S=${PROCESS_WRITE_TIMEOUT_S:-5.0}
      - PROCESS_TELEMETRY_QUEUE=${PROCESS_TELEMETRY_QUEUE:-process.telemetry}
      - PROCESS_RESULT_QUEUE=${PROCESS_RESULT_QUEUE:-process.results}
      - PROCESS_NAMESPACE_INDEX=${OPCUA_NAMESPACE_INDEX:-2}
      - PROCESS_T_J_SET_NODE=${OPCUA_T_J_SET_READ_NODE:-${OPCUA_T_J_SET_NODE:-iCache.Temperature1}}
      - PROCESS_T_NODE=${OPCUA_T_NODE:-Local.iControl.Experiment1.Trends.Tr.Value}
      - PROCESS_T_J_NODE=${OPCUA_T_J_NODE:-Local.iControl.Experiment1.Trends.Tj.Value}
      - PROCESS_C_NODE=${OPCUA_C_NODE:-Local.iControl.Experiment1.Trends.load.Value}
      - PROCESS_COUNT_MIDDLE_NODE=${OPCUA_COUNT_MIDDLE_NODE:-Local.iControl.Experiment1.Trends.count.Value}
      - PROCESS_JACKET_MIN_K=${OPCUA_JACKET_MIN_K:-253.15}
      - PROCESS_JACKET_MAX_K=${OPCUA_JACKET_MAX_K:-453.15}
      - PROCESS_VERIFY_TOLERANCE_K=${OPCUA_VERIFY_TOLERANCE_K:-0.05}
      - CONTROLLER_INFLUX_ENABLED=${CONTROLLER_INFLUX_ENABLED:-true}
      - CONTROLLER_INFLUX_URL=${CONTROLLER_INFLUX_URL:-http://influxdb:8086}
    volumes:
      - type: bind
        source: ${EXPERIMENT_HOST_ROOT:-./.runtime/experiments}
        target: /data/experiments
        bind:
          create_host_path: true
    depends_on:
      - rabbitmq
      - influxdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/status', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  telegraf:
    image: telegraf:1.40.1
    profiles: [process-io]
    command: ["telegraf", "--config", "/etc/telegraf/telegraf.conf", "--config", "/etc/telegraf/opcua.conf"]
    env_file:
      - config/influxdb.env
    environment:
      <<: *opcua-environment
      # Read-only trend overrides must never retarget the writer.
      OPCUA_T_J_SET_NODE: ${OPCUA_T_J_SET_READ_NODE:-${OPCUA_T_J_SET_NODE:-iCache.Temperature1}}
      PROCESS_DEVICE_ID: ${PROCESS_DEVICE_ID:-crystallizer}
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RABBIT_EXCHANGE: idp.bus
      TELEGRAF_INTERVAL: ${TELEGRAF_INTERVAL:-1s}
      TELEGRAF_FLUSH_INTERVAL: ${TELEGRAF_FLUSH_INTERVAL:-1s}
      INFLUX_URL: http://influxdb:8086
    volumes:
      - ./config/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./config/telegraf/opcua.conf:/etc/telegraf/opcua.conf:ro
      - ${OPCUA_CERT_HOST_ROOT:-./config/telegraf/certs}:/run/opcua-certs:ro
      - telegraf_data:/var/lib/telegraf
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  opcua-writer:
    image: *mpc-image
    profiles: [process-io]
    command: ["python", "-m", "crystallization_mpc.apps.opcua_writer"]
    env_file:
      - config/influxdb.env
    environment:
      <<: *opcua-environment
      OPCUA_SERVER_URI: ${OPCUA_SERVER_URI:-}
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/%2F
      RABBIT_EXCHANGE: idp.bus
      OPCUA_WRITER_QUEUE: ${OPCUA_WRITER_QUEUE:-opcua_writer.in}
      OPCUA_WRITER_JOURNAL: /data/commands.sqlite3
      EXPERIMENT_ROOT: /data/experiments
      INFLUX_URL: http://influxdb:8086
    volumes:
      - opcua_writer_data:/data
      - type: bind
        source: ${EXPERIMENT_HOST_ROOT:-./.runtime/experiments}
        target: /data/experiments
        bind:
          create_host_path: true
      - ${OPCUA_CERT_HOST_ROOT:-./config/telegraf/certs}:/run/opcua-certs:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 30s
      timeout: 5s
      retries: 3

  influxdb:
    image: influxdb:2.7
    ports:
      - "8087:8086"
    env_file:
      - config/influxdb.env
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping", "-host", "http://localhost:8086"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3000:3000"
    env_file:
      - config/influxdb.env
    environment:
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/crystallization-mpc.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
  opcua_writer_data:
  telegraf_data:
  rabbitmq_data:
    # To preserve an existing installation, set this to its current data volume
    # and RABBITMQ_HOSTNAME to its current hostname before recreating RabbitMQ.
    name: ${RABBITMQ_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_rabbitmq_data}
