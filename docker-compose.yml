version: "3.9"
services:
  central:
    build:
      context: .
      dockerfile: services/mpc/Dockerfile
    command: ["python", "-m", "crystallization_mpc.apps.central.comm_test"]
    environment:
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - RABBIT_EXCHANGE=idp.bus
    depends_on:
      - rabbitmq
    restart: unless-stopped

  gsensor:
    build:
      context: .
      dockerfile: services/mpc/Dockerfile
    command: ["python", "-m", "crystallization_mpc.apps.gsensor.comm_test"]
    environment:
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - RABBIT_EXCHANGE=idp.bus
    depends_on:
      - rabbitmq
    restart: unless-stopped

  controller:
    build:
      context: .
      dockerfile: services/mpc/Dockerfile
    command: ["python", "-m", "crystallization_mpc.apps.controller.comm_test"]
    environment:
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/%2F
      - RABBIT_EXCHANGE=idp.bus
    depends_on:
      - rabbitmq
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"
      - "15673:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  influxdb:
    image: influxdb:2.7
    ports:
      - "8087:8086"
    env_file:
      - config/influxdb.env
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "influx", "ping", "-host", "http://localhost:8086"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
