<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gsensor UI</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260430-growth-status6">
  </head>
  <body>
    <main class="content">
      <section class="panel hero">
        <div>
          <p class="eyebrow">Crystallization MPC</p>
          <h1>Gsensor UI</h1>
          <p class="muted">Growth-rate measurement service shell.</p>
        </div>
        <div class="actions">
          <span id="status-text" class="status idle">idle</span>
          <span id="initialized-text" class="status idle">not initialized</span>
          <button id="refresh-button" class="ghost">Refresh</button>
        </div>
      </section>

      <section class="grid">
        <div class="panel">
          <div class="panel-head">
            <h2>Active Parameters</h2>
          </div>
          <pre id="params-block" class="code-block"></pre>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Last Message</h2>
          </div>
          <pre id="message-block" class="code-block"></pre>
        </div>
      </section>
    </main>

    <script src="/static/app.js?v=20260430-growth-status6"></script>
  </body>
</html>
