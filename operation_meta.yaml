version: 1
sections:
  - title: "Operation modes"
    items:
      - label: "Controller mode"
        key: "mode"
        kind: "list"
        options: ["MPC", "PI"]
        default: "MPC"
      - label: "Controller: experiment or simulation"
        key: "exp_sim"
        kind: "list"
        options: ["experiment", "simulation"]
        default: "experiment"
      - label: "Control target"
        key: "target"
        kind: "list"
        options: ["sigma", "G"]
        default: "sigma"
      - label: "Adaptive mode"
        key: "adaptive_mode"
        kind: "list"
        options: ["E_A", "k_0", "n", "E_A_and_k_0", "E_A_and_n", "k_0_and_n", "all"]
        default: "E_A"
      - label: "Growth rate sensor: experiment or simulation"
        key: "exp_sim_G"
        kind: "list"
        options: ["simulation", "experiment", "experiment_with_presaved"]
        default: "simulation"
  - title: "Actions"
    items:
      - label: "Start controller"
        key: "controller_active"
        kind: "action_toggle"
        labels: ["Start controller", "Stop controller"]
        default: false
      - label: "Refresh controller now"
        key: "controller_refresh_request"
        kind: "action_push"
      - label: "Add seed"
        key: "add_seed_request"
        kind: "action_push"
      - label: "Start adaptation"
        key: "adaptive"
        kind: "action_toggle"
        labels: ["Start adaptation", "Stop adaptation"]
        default: false
      - label: "Start growth-rate measurement"
        key: "G_active"
        kind: "action_toggle"
        labels: ["Start growth rate", "Stop growth rate"]
        default: false
      - label: "Refresh growth measurement now"
        key: "G_refresh_request"
        kind: "action_push"
      - label: "Inline display on"
        key: "inline_display"
        kind: "action_toggle"
        labels: ["Inline display on", "Inline display off"]
        default: false
      - label: "Pop up and save variables now"
        key: "pop_up_and_save_variables_refresh_request"
        kind: "action_push"
