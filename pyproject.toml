[project]
name = "crystallization_mpc"
version = "0.1.0"
description = "Crystallization MPC platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pika>=1.3,<2.0",
    "pyyaml>=6.0,<7.0",
    "uvicorn>=0.35,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
