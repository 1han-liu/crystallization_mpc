# The legacy [opcua] table is retained for the packaged runtime. Load it as
# the explicit second --config argument:
#   telegraf --config telegraf.conf --config opcua.conf
# Keep OPC UA source time: time_source="collection_start" would overwrite it.
# Different nodes can have different source times. Receivers keep each field's
# source timestamp and cache fields independently.
# Telegraf v1.40.1: plugins/common/opcua/input/input_client.go MetricForNode;
# models/running_input.go MakeMetric (time_source override).
[opcua]
  name = "crystallizer_raw"
  endpoint = "${OPCUA_ENDPOINT}"
  connect_timeout = "${OPCUA_TIMEOUT_S}s"
  request_timeout = "${OPCUA_TIMEOUT_S}s"
  security_policy = "${OPCUA_SECURITY_POLICY}"
  security_mode = "${OPCUA_SECURITY_MODE}"
  auth_method = "${OPCUA_AUTH_METHOD}"
  username = "${OPCUA_USERNAME}"
  password = "${OPCUA_PASSWORD}"
  certificate = "${OPCUA_CERTIFICATE}"
  private_key = "${OPCUA_PRIVATE_KEY}"
  remote_certificate = "${OPCUA_SERVER_CERTIFICATE}"
  timestamp = "source"
  precision = "1ns"
  nodes = [
    {name="T", namespace="${OPCUA_NAMESPACE_INDEX}", identifier_type="s", identifier="${OPCUA_T_NODE}"},
    {name="T_j", namespace="${OPCUA_NAMESPACE_INDEX}", identifier_type="s", identifier="${OPCUA_T_J_NODE}"},
    {name="c", namespace="${OPCUA_NAMESPACE_INDEX}", identifier_type="s", identifier="${OPCUA_C_NODE}"},
    {name="count_middle", namespace="${OPCUA_NAMESPACE_INDEX}", identifier_type="s", identifier="${OPCUA_COUNT_MIDDLE_NODE}"},
    {name="T_j_set", namespace="${OPCUA_NAMESPACE_INDEX}", identifier_type="s", identifier="${OPCUA_T_J_SET_NODE}"},
  ]
  [opcua.tags]
    device = "${PROCESS_DEVICE_ID}"
    timestamp_basis = "source"
