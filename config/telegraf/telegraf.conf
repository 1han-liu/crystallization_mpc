# Load this file FIRST, then opcua.conf LAST. See opcua.conf for the 1.40.1 fix.
# Run normally as a daemon: --test/--once bypass collection_start initialization.
[agent]
  interval = "${TELEGRAF_INTERVAL}"
  flush_interval = "${TELEGRAF_FLUSH_INTERVAL}"
  precision = "1ns"
  round_interval = false
  omit_hostname = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000

[[outputs.amqp]]
  brokers = ["${RABBIT_URL}"]
  exchange = "${RABBIT_EXCHANGE}"
  exchange_type = "topic"
  exchange_durability = "durable"
  routing_key = "telegraf.to.process"
  delivery_mode = "persistent"
  use_batch_format = true
  data_format = "json"
  json_timestamp_units = "1ns"
