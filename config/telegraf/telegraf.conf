# Load this file FIRST, then opcua.conf LAST. See opcua.conf for the 1.40.1 fix.
# Run normally as a daemon: --test/--once bypass collection_start initialization.
[agent]
  interval = "${TELEGRAF_INTERVAL}"
  flush_interval = "${TELEGRAF_FLUSH_INTERVAL}"
  precision = "1ns"
  round_interval = false
  omit_hostname = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  # Fixed 1.40.1 disk buffering is experimental; validate upgrades before use.
  buffer_strategy = "disk"
  buffer_directory = "/var/lib/telegraf/buffer"
  # Per-metric fsync can block 1 s collection on Docker Desktop. Disk buffering
  # survives process restarts; enabling fsync requires a latency acceptance test.
  buffer_disk_sync = false

# Preserve IEEE NaN/Inf before the JSON serializer, which otherwise omits
# those fields. This is a lossless wire/archive encoding, not a value policy.
# Finite process metrics are returned unchanged.
[[processors.starlark]]
  order = 10
  namepass = ["crystallizer_raw"]
  source = '''
def apply(metric):
    symbols = {}
    for name in ("T", "T_j", "c", "count_middle", "T_j_set"):
        value = metric.fields.get(name)
        if type(value) != "float":
            continue
        if str(value).lower() == "nan":
            symbols[name] = "NaN"
        elif value == float("+inf"):
            symbols[name] = "+Inf"
        elif value == float("-inf"):
            symbols[name] = "-Inf"
    if not symbols:
        return metric
    archive = deepcopy(metric, track=True)
    for name, symbol in symbols.items():
        metric.fields[name] = "@mpcrystal:float:" + symbol
        archive.fields.pop(name)
        archive.fields[name + "_nonfinite"] = symbol
    metric.tags["__mpcrystal_numeric_sink"] = "amqp"
    archive.tags["__mpcrystal_numeric_sink"] = "archive"
    return [metric, archive]
'''

[[outputs.amqp]]
  brokers = ["${RABBIT_URL}"]
  exchange = "${RABBIT_EXCHANGE}"
  exchange_type = "topic"
  exchange_durability = "durable"
  routing_key = "telegraf.to.process"
  delivery_mode = "persistent"
  use_batch_format = true
  data_format = "json"
  json_timestamp_units = "1ns"
  tagexclude = ["__mpcrystal_numeric_sink"]
  [outputs.amqp.tagdrop]
    __mpcrystal_numeric_sink = ["archive"]

# Independent continuous archive: successful database delivery does not imply
# that Controller received or used the corresponding AMQP message.
[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  namepass = ["crystallizer_raw"]
  timeout = "5s"
  tagexclude = ["__mpcrystal_numeric_sink"]
  [outputs.influxdb_v2.tagdrop]
    __mpcrystal_numeric_sink = ["amqp"]
